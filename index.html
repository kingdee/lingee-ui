    <script>
      // 在 CSS 与 React 渲染前同步设好主题与语言，避免暗色用户刷新时闪现白底（FOUC）。
      // 读写逻辑与 ThemeContext / i18n 保持一致，两侧 key 必须同步修改。
      (function () {
        try {
          var theme = localStorage.getItem("lingee-ui-theme");
          if (theme !== "dark" && theme !== "light") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);

          var lang = localStorage.getItem("lingee-ui-lang");
          if (lang !== "zh-CN" && lang !== "en-US") {
            lang = navigator.language.toLowerCase().indexOf("zh") === 0 ? "zh-CN" : "en-US";
          }
          document.documentElement.setAttribute("lang", lang);
        } catch (e) {
          // localStorage 在隐私模式下可能抛错，回退默认亮色中文
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.setAttribute("lang", "zh-CN");
        }
      })();
    </script>
